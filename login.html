<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول</title>
<style>
:root{--bg:#f4f8f9;--fg:#0d2b36;--muted:#4b6670;--accent:#02798f;--card:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1a20;--fg:#e4f1f4;--muted:#9bb6bf;--accent:#4cc7dd;--card:#122830;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,sans-serif;padding:24px 16px}
.c{background:var(--card);max-width:420px;padding:32px;border-radius:16px;text-align:center}
h1{font-size:20px;margin:0 0 8px}p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;background:var(--accent);color:var(--card);padding:10px 24px;border-radius:999px;text-decoration:none}
</style></head><body><div class="c"><h1>تسجيل الدخول غير متاح في نسخة العرض</h1>
<p>يشتغل تسجيل الدخول بعد ربط الموقع بالخادم ونظام الدخول الموحّد على استضافة المركز.</p>
<a href="./#/home">الرجوع للموقع</a></div></body></html>
