  <!-- Inline script to check route and control loader visibility early -->
  <script>
    // Immediately check if we're on root path (/ or empty path)
    (function () {
      var path = window.location.pathname;
      var isRootPath = path === '/home' || path === '' || path.match(/^\/?index\.html$/i);
      // Store this information for later use
      window.showInitialLoader = isRootPath;
      // Add a class to the HTML element for CSS control
      document.documentElement.className += isRootPath ? ' is-home-route' : ' is-not-home-route';
    })();
  </script>

  </noscript>
  <!-- Critical inline styles for faster LCP -->
  <style>
    /* Minimal reference to fadeIn animation to ensure it's not stripped in production */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Inline critical styles for the loading element (LCP element) */
    html.is-not-home-route .app-loading {
      display: none !important;
    }

    .app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: linear-gradient(0deg, #02afd4, #023b50);
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .app-loading-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 123, 255, 0.3);
      border-radius: 50%;
      border-top-color: #007bff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Angular will inject scripts here during build -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Fade out the initial loader when the Angular app has rendered children.
      var loadingDiv = document.getElementById('initial-loader');
      if (!window.showInitialLoader || !loadingDiv) return;

      var checkAppReady = function () {
        var appElement = document.querySelector('app-root');
        if (appElement && appElement.children && appElement.children.length > 2) {
          loadingDiv.style.opacity = '0';
          setTimeout(function () { loadingDiv.style.display = 'none'; }, 500);
          return true;
        }
        return false;
      };

      var readyCheckInterval = setInterval(function () { if (checkAppReady()) clearInterval(readyCheckInterval); }, 100);
      // Backup timeout to ensure loader is removed after 5s
      setTimeout(function () { clearInterval(readyCheckInterval); loadingDiv.style.opacity = '0'; setTimeout(function () { loadingDiv.style.display = 'none'; }, 500); }, 5000);
    });
  </script>
